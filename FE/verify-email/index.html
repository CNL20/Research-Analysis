<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarTrend - Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle background animation */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--primary);
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            animation: float 10s infinite ease-in-out alternate;
            top: -10%;
            left: -10%;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: #a855f7;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            animation: float 8s infinite ease-in-out alternate-reverse;
            bottom: -10%;
            right: -10%;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .auth-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Verification Status Area */
        #verification-status {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
            display: none;
            border: 1px solid transparent;
        }

        .status-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Login Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        #result-container {
            margin-top: 20px;
            padding: 15px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            word-wrap: break-word;
            display: none;
            color: var(--success);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="header">
            <h1>ScholarTrend</h1>
            <p>Welcome to the Research Community</p>
        </div>

        <!-- Verification Status -->
        <div id="verification-status">
            <div id="status-icon" class="status-icon"></div>
            <div id="status-spinner" class="spinner"></div>
            <h3 id="status-title">Verifying...</h3>
            <p id="status-message" style="font-size: 13px; color: var(--text-muted); margin-top: 5px;">Please wait while we verify your email address.</p>
        </div>

        <!-- Login Form -->
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn" id="login-btn">Sign In</button>
        </form>

        <div id="result-container"></div>
    </div>

    <script>
        // Cấu hình URL của Backend (Thường là https://localhost:7085 khi chạy Development)
        // Nếu bạn chạy API bằng IP LAN, hãy đổi URL này thành IP tương ứng, VD: https://192.168.100.188:7085
        const API_BASE_URL = 'https://localhost:7085'; 
        
        // Elements
        const verificationStatus = document.getElementById('verification-status');
        const statusSpinner = document.getElementById('status-spinner');
        const statusIcon = document.getElementById('status-icon');
        const statusTitle = document.getElementById('status-title');
        const statusMessage = document.getElementById('status-message');
        const emailInput = document.getElementById('email');
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const resultContainer = document.getElementById('result-container');

        // Parse URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const verifyEmail = urlParams.get('email');
        const verifyToken = urlParams.get('token');

        // Xử lý Verification nếu có param trên URL
        if (verifyEmail && verifyToken) {
            verificationStatus.style.display = 'block';
            emailInput.value = verifyEmail; // Điền sẵn email vào form đăng nhập

            // Gọi API Verify Email
            fetch(`${API_BASE_URL}/api/Auth/verify-email`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: verifyEmail,
                    token: verifyToken
                })
            })
            .then(async response => {
                const data = await response.json();
                statusSpinner.style.display = 'none';
                
                if (response.ok && data.isSuccess) {
                    // Thành công
                    statusIcon.innerText = '✅';
                    statusTitle.innerText = 'Email Verified!';
                    statusTitle.style.color = 'var(--success)';
                    statusMessage.innerText = 'Your email has been successfully verified. You can now log in.';
                    verificationStatus.style.borderColor = 'rgba(16, 185, 129, 0.3)';
                } else {
                    // Thất bại
                    statusIcon.innerText = '❌';
                    statusTitle.innerText = 'Verification Failed';
                    statusTitle.style.color = 'var(--error)';
                    statusMessage.innerText = data.message || 'The verification link may be invalid or expired.';
                    verificationStatus.style.borderColor = 'rgba(239, 68, 68, 0.3)';
                }
            })
            .catch(error => {
                statusSpinner.style.display = 'none';
                statusIcon.innerText = '⚠️';
                statusTitle.innerText = 'Network Error';
                statusTitle.style.color = 'var(--error)';
                statusMessage.innerText = 'Could not connect to the server. Please ensure the Backend API is running.';
                console.error('Error:', error);
            });
        }

        // Xử lý Login Truyền thống
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = emailInput.value;
            const password = document.getElementById('password').value;
            
            loginBtn.innerText = 'Signing in...';
            loginBtn.disabled = true;
            resultContainer.style.display = 'none';

            fetch(`${API_BASE_URL}/api/Auth/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            })
            .then(async response => {
                const data = await response.json();
                loginBtn.innerText = 'Sign In';
                loginBtn.disabled = false;
                
                resultContainer.style.display = 'block';
                if (response.ok && data.isSuccess) {
                    resultContainer.style.color = 'var(--success)';
                    resultContainer.innerHTML = `<strong>Login Successful!</strong><br><br>JWT Token:<br>${data.data.token.substring(0, 50)}...`;
                } else {
                    resultContainer.style.color = 'var(--error)';
                    resultContainer.innerHTML = `<strong>Login Failed:</strong><br>${data.message}`;
                }
            })
            .catch(error => {
                loginBtn.innerText = 'Sign In';
                loginBtn.disabled = false;
                resultContainer.style.display = 'block';
                resultContainer.style.color = 'var(--error)';
                resultContainer.innerHTML = `<strong>Network Error:</strong> Cannot connect to backend.`;
            });
        });
    </script>
</body>
</html>
